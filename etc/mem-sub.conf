# ========== GLOBAL ==========
[agent]
  interval = "3s"
  flush_interval = "3s"
  omit_hostname = false

###############################################################################
# ▶️ 从 MQTT 订阅 mem 数据（格式为 Telegraf JSON）
###############################################################################
[[inputs.mqtt_consumer]]
  servers = ["tcp://localhost:1883"]
  topics = ["telegraf/metrics"]
  client_id = "telegraf-mqtt-consumer"
  data_format = "json"
  qos = 2
  json_name_key = "name"
  tag_keys = ["tags.host"]
  json_time_key = "timestamp"
  json_time_format = "unix"

###############################################################################
# ▶️ 修改 metric 名为 mem_metrics（即表名）
###############################################################################
[[processors.override]]
  namepass = ["mem"]
  name_override = "mem_metrics"

###############################################################################
# ▶️ 使用 processors.rename 去除 fields_ 前缀
###############################################################################
[[processors.rename]]
  [[processors.rename.replace]]
    field = "fields_wired"
    dest = "wired"

  [[processors.rename.replace]]
    field = "fields_free"
    dest = "free"

  [[processors.rename.replace]]
    field = "fields_available_percent"
    dest = "available_percent"

  [[processors.rename.replace]]
    field = "fields_total"
    dest = "total"

  [[processors.rename.replace]]
    field = "fields_used"
    dest = "used"

  [[processors.rename.replace]]
    field = "fields_active"
    dest = "active"

  [[processors.rename.replace]]
    field = "fields_inactive"
    dest = "inactive"

  [[processors.rename.replace]]
    field = "fields_used_percent"
    dest = "used_percent"

  [[processors.rename.replace]]
    field = "fields_available"
    dest = "available"


[[processors.filter]]
  namepass = ["mem_metrics"]
  fielddrop = ["wired"]

###############################################################################
# ▶️ 输出到 stdout（调试用，可删）
###############################################################################
[[outputs.file]]
  files = ["stdout"]
  data_format = "influx"

###############################################################################
# ▶️ 写入 TimescaleDB / PostgreSQL
###############################################################################
[[outputs.sql]]
  driver = "pgx"
  data_source_name = "host=192.168.0.81 user=aics password=aics1234 dbname=aics sslmode=disable"
  timestamp_column = "time"
  table_template = ""  # 禁用建表
  table_exists_template = "SELECT 1 FROM mem_metrics LIMIT 1"

  [outputs.sql.convert]
    real = "float8"
    integer = "int8"